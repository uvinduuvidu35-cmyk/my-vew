<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Mage Menika ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&family=Abhaya+Libre:wght@600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(rgba(13, 0, 26, 0.75), rgba(42, 0, 51, 0.85)), 
                        url('https://user35788.na.imgto.link/public/20260924/1000028595.avif') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
            padding: 20px;
            position: relative;
        }

        /* Floating Music Button */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 51, 153, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            z-index: 100;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(255, 51, 153, 0.5);
            transition: 0.3s;
        }

        .music-btn:hover {
            transform: scale(1.05);
            background: rgba(255, 51, 153, 1);
        }

        /* Falling Background Items */
        .falling-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .falling-item {
            position: absolute;
            top: -50px;
            font-size: 24px;
            user-select: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.2;
            }
        }

        /* Card Container */
        .container {
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            padding: 35px 25px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #ff66b2;
        }

        #timer {
            font-size: 3rem;
            font-weight: bold;
            margin: 15px 0;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px #ff3399;
        }

        /* Sinhala Love Message Style */
        .love-message {
            font-family: 'Abhaya Libre', serif;
            font-size: 1.8rem;
            font-weight: 800;
            color: #ff99dd;
            margin-top: 15px;
            text-shadow: 0 0 8px rgba(255, 102, 178, 0.8);
            letter-spacing: 1px;
        }

        .go-btn {
            display: none;
            margin: 20px auto 0;
            padding: 12px 40px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #ff3399, #ff66b2);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 51, 153, 0.8);
            animation: pulse 1.5s infinite;
            text-decoration: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Background Music Player -->
    <audio id="bgMusic" loop autoplay>
        <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a732fb.mp3?filename=happy-birthday-155461.mp3" type="audio/mpeg">
    </audio>

    <!-- Music Control Button -->
    <button class="music-btn" onclick="toggleMusic()">
        🎵 <span id="musicBtnText">Play Music</span>
    </button>

    <!-- Background Falling Elements -->
    <div class="falling-container" id="fallingContainer"></div>

    <div class="container">
        <h1>Waiting for the Surprise... ❤️</h1>
        <div id="timer">05:00</div>
        
        <!-- Sinhala Text -->
        <div class="love-message">මගේ මැණික, ආදරෙයි ❤️</div>

        <button id="goBtn" class="go-btn" onclick="goToNextPage()">GO ❤️</button>
    </div>

    <script>
        // Music Player Controls
        const music = document.getElementById('bgMusic');
        const musicBtnText = document.getElementById('musicBtnText');

        // Auto-play attempt on user click anywhere
        document.body.addEventListener('click', function() {
            if (music.paused) {
                music.play().then(() => {
                    musicBtnText.textContent = "Pause Music";
                }).catch(() => {});
            }
        }, { once: true });

        function toggleMusic() {
            if (music.paused) {
                music.play();
                musicBtnText.textContent = "Pause Music";
            } else {
                music.pause();
                musicBtnText.textContent = "Play Music";
            }
        }

        // Set 5 minutes countdown
        let duration = 5 * 60; 
        const timerDisplay = document.getElementById('timer');
        const goBtn = document.getElementById('goBtn');

        const countdown = setInterval(() => {
            let minutes = Math.floor(duration / 60);
            let seconds = duration % 60;

            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            timerDisplay.textContent = `${minutes}:${seconds}`;

            if (--duration < 0) {
                clearInterval(countdown);
                timerDisplay.textContent = "It's Time! 🎉";
                
                // Show GO Button immediately with Fireworks
                goBtn.style.display = 'inline-block';

                // Trigger Fireworks
                launchFireworks();
            }
        }, 1000);

        // Fireworks Function
        function launchFireworks() {
            var duration = 5 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        function randomInRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        function goToNextPage() {
            window.location.href = "letter.html";
        }

        // Falling Elements
        const fallingItems = ['❤️', '💖', '🎂', '🎁', '🎈', '✨'];
        const fallingContainer = document.getElementById('fallingContainer');

        function createFallingItem() {
            const item = document.createElement('div');
            item.classList.add('falling-item');
            item.innerText = fallingItems[Math.floor(Math.random() * fallingItems.length)];
            item.style.left = Math.random() * 100 + 'vw';
            item.style.animationDuration = Math.random() * 3 + 4 + 's';
            item.style.fontSize = Math.random() * 15 + 20 + 'px';
            
            fallingContainer.appendChild(item);

            setTimeout(() => {
                item.remove();
            }, 7000);
        }

        setInterval(createFallingItem, 300);
    </script>
</body>
</html>
